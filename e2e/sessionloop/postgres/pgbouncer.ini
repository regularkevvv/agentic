; Two backend connections intentionally serve many worker/client connections.
[databases]
e2e = host=postgres port=5432 dbname=e2e pool_mode=transaction pool_size=2
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = e2e
pool_mode = transaction
default_pool_size = 2
reserve_pool_size = 0
max_db_connections = 2
max_client_conn = 200
max_prepared_statements = 0
ignore_startup_parameters = extra_float_digits
