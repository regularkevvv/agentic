name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JUST_VERSION: 1.58.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          install-mode: goinstall

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: GOWORK=off go test -race -count=1 -timeout 60s ./...
      - name: Check build
        run: GOWORK=off go build ./...

  provider-modules:
    name: Provider (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        provider:
          - anthropic
          - azure
          - bedrock
          - cohere
          - deepinfra
          - endpoint
          - gemini
          - grok
          - huggingface
          - ollama
          - openai
          - openrouter
          - pinecone
          - sagemaker
          - together
          - voyageai
    defaults:
      run:
        working-directory: provider/${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/${{ matrix.provider }}/go.mod
      - name: Prove the standalone module view
        run: |
          GOWORK=off go mod tidy -diff
          GOWORK=off go test -race -count=1 -timeout 60s ./...
          GOWORK=off go vet ./...
          GOWORK=off CGO_ENABLED=0 go build ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          install-mode: goinstall
          working-directory: provider/${{ matrix.provider }}

  harness:
    name: Harness workspace view
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/go.mod
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Test against the coordinated workspace
        run: go test -race -count=1 -timeout 60s ./...
      - name: Vet
        run: go vet ./...
      - name: Check build
        run: CGO_ENABLED=0 go build ./...
      - name: Enforce coverage threshold
        run: just coverage-check

  harness-lint:
    name: Harness lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          install-mode: goinstall
          working-directory: harness

  otel-module:
    name: Optional OpenTelemetry module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: otel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: otel/go.mod
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      # The root instrumentation API and this adapter release together. The
      # workspace supplies the checkout until root v0.7.0 has been published;
      # release-view.yml later proves the adapter with GOWORK=off.
      - name: Race test against the coordinated workspace
        run: go test -race -count=1 -timeout 60s ./...
      - name: Vet and pure-Go build
        run: go vet ./... && CGO_ENABLED=0 go build ./...
      - name: Enforce coverage threshold
        run: just coverage-check

  otel-lint:
    name: Optional OpenTelemetry lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: otel/go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          install-mode: goinstall
          working-directory: otel

  gomonty-module:
    name: Optional GoMonty adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: harness/codemode/gomonty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/codemode/gomonty/go.mod
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Race test
        run: go test -race -count=1 -timeout 60s ./...
      - name: Vet and pure-Go build
        run: go vet ./... && CGO_ENABLED=0 go build ./...
      - name: Enforce coverage threshold
        run: just coverage-check

  gomonty-lint:
    name: Optional GoMonty adapter lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/codemode/gomonty/go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          install-mode: goinstall
          working-directory: harness/codemode/gomonty

  sessionloop-module:
    name: Sessionloop module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: harness/sessionloop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/sessionloop/go.mod
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Race test
        run: go test -race -count=1 -timeout 60s ./...
      - name: Vet and pure-Go build
        run: go vet ./... && CGO_ENABLED=0 go build ./...
      - name: Enforce coverage threshold
        run: just coverage-check
      - name: Module isolation
        run: GOWORK=off go test -race -count=1 ./... && GOWORK=off go mod tidy -diff && test "$(GOWORK=off go list -m all | wc -l)" -eq 1

  sessionloop-lint:
    name: Sessionloop lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/sessionloop/go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          install-mode: goinstall
          working-directory: harness/sessionloop

  tui-module:
    name: TUI module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Race test
        run: go test -race -count=1 -timeout 60s ./...
      - name: Vet and pure-Go build
        run: go vet ./... && CGO_ENABLED=0 go build ./...
      - name: Enforce coverage threshold
        run: just coverage-check

  tui-lint:
    name: TUI module lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          install-mode: goinstall
          working-directory: tui

  # The live tests and the examples are their own module, so they have left the
  # root's `go build ./...`. Without this job an incompatible API change would
  # break them silently and be discovered only by whoever next ran an example by
  # hand. The tests are behind //go:build e2e, so a plain build compiles none of
  # them; vetting with the tag typechecks the tagged tests and the untagged
  # examples in one pass. Nothing here executes a test that needs a credential.
  e2e-module:
    name: E2E module compiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
      - name: Typecheck the live tests and the examples
        run: go vet -tags=e2e ./...
      - name: Check build
        run: CGO_ENABLED=0 go build ./...
      - name: Enforce the module boundary
        run: go test -count=1 ./...

  # While the examples and live tests were packages of the root module, the Lint
  # job above covered them. Leaving the module took them out of that net, so this
  # puts them back. --build-tags=e2e for the reason the job above vets with it:
  # e2e/providers has no untagged files, and without the tag golangci-lint
  # reports success over a package it never opened.
  e2e-lint:
    name: E2E module lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          install-mode: goinstall
          working-directory: e2e
          args: --build-tags=e2e

  # This is a credential-free transport proof, not a mocked SDK test. The
  # Compose stack builds the deterministic scenario runner, sends traces,
  # metrics, and logs over OTLP/gRPC to a digest-pinned real Collector, then
  # parses and asserts the Collector's file-exporter output.
  otel-e2e:
    name: OpenTelemetry Collector E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Prove exported traces, metrics, logs, and privacy
        run: just otel-e2e

  # Unlike the provider-tagged tests, this credential-free e2e is safe to run
  # on every change. It downloads the exact GoMonty release asset selected by
  # the source module's committed manifest, verifies all hashes, starts the real
  # Monty worker, and crosses the complete Harness Codemode path. The ordinary
  # e2e-module job remains offline because the test is explicitly gated.
  gomonty-e2e:
    name: Harness Codemode (GoMonty)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    env:
      GOMONTY_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
      - name: Run the full Harness Codemode path
        env:
          GOMONTY_CACHE_DIR: ${{ runner.temp }}/gomonty-runtime
        run: go test -race -count=1 -timeout 3m ./codemode

  # provider/local/onnx is a nested module that needs CGO, a native ONNX Runtime, and a
  # statically linked tokenizer. It is invisible to every job above and gates
  # none of them, but it gates itself: this job fails the workflow, because the
  # platform it covers is no longer unverified.
  #
  # linux/amd64 was checked by running the live tests in a golang:1.25-bookworm
  # container against the real exported graph on 2026-08-01. Every coordinate
  # index matched the PyTorch golden and the largest weight difference was
  # 4.38e-06, against darwin/arm64's 4.56e-06 — both far inside the 1e-4 gate.
  # A red tick here is therefore a real defect, not a platform caveat.
  #
  # What this job still does not cover: the live tests skip, because the exported
  # graph is 117 MiB and has no home in CI. It proves the two downloads still
  # exist, the module compiles and lints against them, and the unit tests pass.
  onnx:
    name: Local inference module (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: provider/local/onnx
    env:
      GOWORK: "off"
      CGO_LDFLAGS: -L${{ github.workspace }}/provider/local/onnx/lib
      ONNXRUNTIME_VERSION: 1.28.0
      TOKENIZERS_VERSION: v1.27.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # This job builds both modules. The acceptance module replaces the
          # checkout's root module, whose Go floor can be newer than the
          # independently released ONNX provider module.
          go-version-file: e2e/localinference/go.mod
      # Static, and needed at link time. Only -L is passed: the binding's own
      # #cgo LDFLAGS already supply -ltokenizers -ldl -lm -lstdc++.
      - name: Fetch libtokenizers.a
        run: |
          mkdir -p lib
          curl -fsSL "https://github.com/daulet/tokenizers/releases/download/${TOKENIZERS_VERSION}/libtokenizers.linux-amd64.tar.gz" \
            | tar xz -C lib
          ls -l lib/libtokenizers.a
      # Dynamic, and loaded at run time rather than linked, which is why it is
      # named by an environment variable instead of by a linker flag.
      - name: Install ONNX Runtime
        run: |
          curl -fsSL -O "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          tar xzf "onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          echo "AGENTIC_ONNX_LIBRARY=$PWD/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}/lib/libonnxruntime.so" >> "$GITHUB_ENV"
      - name: Vet
        run: go vet ./...
      - name: Check build
        run: go build ./...
      - name: Unit tests and the module boundary
        run: go test -count=1 ./...
      # Run here rather than as its own job: linting cgo means compiling it, and
      # this job has already paid for the two downloads that makes possible.
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6 run ./...
      # e2e/localinference holds the one example that imports this package, and
      # is the only consumer proving the module is usable from outside itself.
      # It shares this job because it needs the same two artifacts.
      - name: Build and lint the example that uses it
        working-directory: e2e/localinference
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/provider/local/onnx/lib
        run: |
          go build ./...
          go vet ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6 run ./...

  workspace:
    name: Workspace integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Test every pure-Go module together
        run: just test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Enforce coverage threshold
        run: just coverage-all

  vet:
    name: Vet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: just vet

  # Golden fixtures are meant to be derived from sanitized real responses, so a
  # sanitization miss commits a live credential to a public repository. This
  # fails on the token shapes the providers here actually issue.
  fixtures:
    name: Fixture secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan recorded fixtures for credentials
        run: |
          set -uo pipefail
          pattern='sk-[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|pcsk_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|Bearer [A-Za-z0-9._-]{20,}|aws_secret_access_key'
          hits=$(grep -rInE "$pattern" \
            --include='*.json' --include='*.txt' --include='*.jsonl' \
            --exclude-dir=.git . || true)
          if [ -n "$hits" ]; then
            echo "::error::a fixture appears to contain a credential"
            echo "$hits"
            exit 1
          fi
          echo "no credential-shaped strings in recorded fixtures"
