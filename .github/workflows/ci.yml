name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          install-mode: goinstall

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: GOWORK=off go test -race -count=1 -timeout 60s $(GOWORK=off go list ./... | grep -v /e2e)
      - name: Check build
        run: GOWORK=off go build ./...

  harness:
    name: Harness release view
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/go.mod
      - name: Test against released Agentic
        run: GOWORK=off go test -race -count=1 -timeout 60s ./...
      - name: Vet
        run: GOWORK=off go vet ./...
      - name: Check build
        run: GOWORK=off go build ./...
      - name: Enforce coverage threshold
        run: GOWORK=off make coverage-check

  harness-lint:
    name: Harness lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          install-mode: goinstall
          working-directory: harness

  workspace:
    name: Workspace integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test both modules
        run: go test -race -count=1 -timeout 60s ./... ./harness/...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Enforce coverage threshold
        run: make coverage-check

  vet:
    name: Vet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  # The reference representation handler is deployed to endpoints we do not
  # control, so its protocol half is tested here on every push. Only pytest and
  # jsonschema are installed: the model is faked, so no GPU and no
  # multi-gigabyte download are involved, and the runtime pins in
  # requirements.txt stay out of CI's dependency surface.
  handler:
    name: Representation handler contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: deploy/representations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract-test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run contract tests
        run: pytest -q

  # Golden fixtures are meant to be derived from sanitized real responses, so a
  # sanitization miss commits a live credential to a public repository. This
  # fails on the token shapes the providers here actually issue.
  fixtures:
    name: Fixture secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan recorded fixtures for credentials
        run: |
          set -uo pipefail
          pattern='sk-[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|pcsk_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|Bearer [A-Za-z0-9._-]{20,}|aws_secret_access_key'
          hits=$(grep -rInE "$pattern" \
            --include='*.json' --include='*.txt' --include='*.jsonl' \
            --exclude-dir=.git . || true)
          if [ -n "$hits" ]; then
            echo "::error::a fixture appears to contain a credential"
            echo "$hits"
            exit 1
          fi
          echo "no credential-shaped strings in recorded fixtures"
