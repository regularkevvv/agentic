name: Release module verification

on:
  push:
    tags:
      - "v*"
      - "harness/v*"
      - "harness/codemode/gomonty/v*"
      - "harness/sessionloop/v*"
      - "otel/v*"
      - "provider/*/v*"
      - "provider/local/onnx/v*"
      - "tui/v*"
  workflow_dispatch:
    inputs:
      module:
        description: Module whose published dependencies should be verified
        required: true
        type: choice
        options:
          - root
          - harness
          - gomonty
          - sessionloop
          - onnx
          - otel
          - providers
          - tui

permissions:
  contents: read

jobs:
  root:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.module == 'root') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOWORK=off go test -race -count=1 -timeout 60s ./...
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off CGO_ENABLED=0 go build ./...
      - run: GOWORK=off make coverage-check

  providers:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.module == 'providers') || (startsWith(github.ref, 'refs/tags/provider/') && !startsWith(github.ref, 'refs/tags/provider/local/onnx/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        provider:
          - anthropic
          - azure
          - bedrock
          - cohere
          - deepinfra
          - endpoint
          - gemini
          - grok
          - huggingface
          - ollama
          - openai
          - openrouter
          - pinecone
          - sagemaker
          - together
          - voyageai
    defaults:
      run:
        working-directory: provider/${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/${{ matrix.provider }}/go.mod
      - run: GOWORK=off go mod tidy -diff
      - run: GOWORK=off go test -race -count=1 -timeout 60s ./...
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off CGO_ENABLED=0 go build ./...
      - name: Run a fresh no-replace provider consumer
        if: ${{ startsWith(github.ref, format('refs/tags/provider/{0}/v', matrix.provider)) }}
        run: |
          module="github.com/regularkevvv/agentic/provider/${{ matrix.provider }}"
          version="${GITHUB_REF_NAME#provider/${{ matrix.provider }}/}"
          consumer="${RUNNER_TEMP}/agentic-${{ matrix.provider }}-consumer"
          mkdir -p "${consumer}"
          cd "${consumer}"
          go mod init consumer
          GOWORK=off GONOSUMDB="${module}" GOPROXY=direct go get "${module}@${version}"
          test -z "$(GOWORK=off go list -m -f '{{if .Replace}}{{.Path}}{{end}}' all)"
          test "$(GOWORK=off go list -m -f '{{.Version}}' "${module}")" = "${version}"
          GOWORK=off go test "${module}/..."

  harness:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.module == 'harness') || startsWith(github.ref, 'refs/tags/harness/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/go.mod
      - run: GOWORK=off go test -race -count=1 -timeout 60s ./...
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off CGO_ENABLED=0 go build ./...
      - run: GOWORK=off make coverage-check
      - name: Run a fresh no-replace streaming host consumer
        run: |
          consumer="${RUNNER_TEMP}/agentic-harness-consumer"
          mkdir -p "${consumer}"
          cp -R ../.github/testdata/harness-consumer/. "${consumer}/"
          mv "${consumer}/go.mod.template" "${consumer}/go.mod"
          cd "${consumer}"
          # Fetch only the brand-new Harness module directly from its public
          # VCS tag; root Agentic and sessionloop remain checksummed.
          GOWORK=off GONOSUMDB=github.com/regularkevvv/agentic/harness GOPROXY=direct go run -mod=mod .
          test -z "$(GOWORK=off go list -m -f '{{if .Replace}}{{.Path}}{{end}}' all)"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/regularkevvv/agentic/harness)" = "v0.5.0"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/regularkevvv/agentic)" = "v0.7.0"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/regularkevvv/agentic/harness/sessionloop)" = "v0.1.0"

  gomonty:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.module == 'gomonty') || startsWith(github.ref, 'refs/tags/harness/codemode/gomonty/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: harness/codemode/gomonty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/codemode/gomonty/go.mod
      - run: GOWORK=off go test -race -count=1 -timeout 60s ./...
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off CGO_ENABLED=0 go build ./...
      - run: GOWORK=off make coverage-check
      - name: Run a fresh no-replace adapter consumer
        run: |
          consumer="${RUNNER_TEMP}/agentic-gomonty-consumer"
          mkdir -p "${consumer}"
          cp -R ../../../.github/testdata/gomonty-consumer/. "${consumer}/"
          mv "${consumer}/go.mod.template" "${consumer}/go.mod"
          cd "${consumer}"
          # Fetch only the brand-new adapter module directly from its public
          # VCS tag; Harness, Agentic, and GoMonty remain checksummed.
          GOWORK=off GONOSUMDB=github.com/regularkevvv/agentic/harness/codemode/gomonty GOPROXY=direct go run -mod=mod .
          test -z "$(GOWORK=off go list -m -f '{{if .Replace}}{{.Path}}{{end}}' all)"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/regularkevvv/agentic/harness/codemode/gomonty)" = "v0.1.0"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/regularkevvv/agentic/harness)" = "v0.3.0"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/regularkevvv/agentic)" = "v0.6.0"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/regularkevvv/gomonty)" = "v0.0.15"

  sessionloop:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.module == 'sessionloop') || startsWith(github.ref, 'refs/tags/harness/sessionloop/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: harness/sessionloop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/sessionloop/go.mod
      - run: GOWORK=off go test -race -count=1 -timeout 60s ./...
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off CGO_ENABLED=0 go build ./...
      - run: GOWORK=off make coverage-check
      - name: Run a fresh no-replace protocol consumer
        run: |
          consumer="${RUNNER_TEMP}/agentic-sessionloop-consumer"
          mkdir -p "${consumer}"
          cp -R testdata/consumer/. "${consumer}/"
          mv "${consumer}/go.mod.template" "${consumer}/go.mod"
          cd "${consumer}"
          # This tag-triggered job can run before the public checksum service
          # sees the new module tag. Fetch only this module directly from its
          # public VCS tag; all of its dependencies remain checksummed.
          GOWORK=off GOPROXY=direct GONOSUMDB=github.com/regularkevvv/agentic/harness/sessionloop go run -mod=mod .
          ! (GOWORK=off go mod graph | grep -E 'agentic($|[@ ])|agentic/harness($|[@ ])|bubbletea|lipgloss|openai|anthropic|gomonty')

  onnx:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.module == 'onnx') || startsWith(github.ref, 'refs/tags/provider/local/onnx/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: provider/local/onnx
    env:
      GOWORK: "off"
      CGO_LDFLAGS: -L${{ github.workspace }}/provider/local/onnx/lib
      ONNXRUNTIME_VERSION: 1.28.0
      TOKENIZERS_VERSION: v1.27.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/local/onnx/go.mod
      - name: Fetch libtokenizers.a
        run: |
          mkdir -p lib
          curl -fsSL "https://github.com/daulet/tokenizers/releases/download/${TOKENIZERS_VERSION}/libtokenizers.linux-amd64.tar.gz" \
            | tar xz -C lib
          ls -l lib/libtokenizers.a
      - name: Install ONNX Runtime
        run: |
          curl -fsSL -O "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          tar xzf "onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          echo "AGENTIC_ONNX_LIBRARY=$PWD/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}/lib/libonnxruntime.so" >> "$GITHUB_ENV"
      - run: go test -race -count=1 -timeout 60s ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Run a fresh no-replace native-provider consumer
        run: |
          consumer="${RUNNER_TEMP}/agentic-onnx-consumer"
          mkdir -p "${consumer}"
          cp -R testdata/consumer/. "${consumer}/"
          mv "${consumer}/go.mod.template" "${consumer}/go.mod"
          cd "${consumer}"
          # Fetch only the brand-new provider module directly from its public
          # VCS tag; its released root dependency remains checksummed.
          GONOSUMDB=github.com/regularkevvv/agentic/provider/local/onnx GOPROXY=direct go run -mod=mod .
          test -z "$(go list -m -f '{{if .Replace}}{{.Path}}{{end}}' all)"
          test "$(go list -m -f '{{.Version}}' github.com/regularkevvv/agentic)" = "v0.6.0"

  otel:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.module == 'otel') || startsWith(github.ref, 'refs/tags/otel/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: otel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: otel/go.mod
      - run: GOWORK=off go test -race -count=1 -timeout 60s ./...
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off CGO_ENABLED=0 go build ./...
      - run: GOWORK=off make coverage-check
      - run: GOWORK=off go mod tidy -diff
      - name: Run a fresh no-replace OTel consumer
        run: |
          consumer="${RUNNER_TEMP}/agentic-otel-consumer"
          mkdir -p "${consumer}"
          cp -R ../.github/testdata/otel-consumer/. "${consumer}/"
          mv "${consumer}/go.mod.template" "${consumer}/go.mod"
          cd "${consumer}"
          # Fetch only the brand-new adapter from its VCS tag; its released
          # Agentic and OpenTelemetry dependencies remain checksummed.
          GOWORK=off GONOSUMDB=github.com/regularkevvv/agentic/otel GOPROXY=direct go run -mod=mod .
          test -z "$(GOWORK=off go list -m -f '{{if .Replace}}{{.Path}}{{end}}' all)"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/regularkevvv/agentic/otel)" = "v0.1.0"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/regularkevvv/agentic)" = "v0.7.0"

  tui:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.module == 'tui') || startsWith(github.ref, 'refs/tags/tui/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
      - run: GOWORK=off go test -race -count=1 -timeout 60s ./...
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off CGO_ENABLED=0 go build ./...
      - run: GOWORK=off make coverage-check
      - name: Run a fresh no-replace compatible-host consumer
        run: |
          consumer="${RUNNER_TEMP}/agentic-tui-consumer"
          mkdir -p "${consumer}"
          cp -R testdata/consumer/. "${consumer}/"
          mv "${consumer}/go.mod.template" "${consumer}/go.mod"
          cd "${consumer}"
          # This tag-triggered job can run before the public checksum service
          # sees the new module tag. Fetch only this module directly from its
          # public VCS tag; all of its dependencies remain checksummed.
          GOWORK=off GOPROXY=direct GONOSUMDB=github.com/regularkevvv/agentic/tui go run -mod=mod .
          test -z "$(GOWORK=off go list -m -f '{{if .Replace}}{{.Path}}{{end}}' all)"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/regularkevvv/agentic/tui)" = "v0.1.0"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/regularkevvv/agentic/harness)" = "v0.3.0"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/regularkevvv/agentic)" = "v0.6.0"
          test "$(GOWORK=off go list -m -f '{{.Version}}' github.com/regularkevvv/agentic/harness/sessionloop)" = "v0.1.0"
