name: Session contract proofs

on:
  push:
    branches: [main, develop]
    paths:
      - harness/sessionloop/actor/spec/**
      - .github/workflows/session-contract.yml
  pull_request:
    paths:
      - harness/sessionloop/actor/spec/**
      - .github/workflows/session-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: harness/sessionloop/actor/spec
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
      - name: Check proofs, audit axioms and recheck proof terms
        working-directory: harness/sessionloop/actor/spec
        run: bash verify.sh
