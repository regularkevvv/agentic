version: "2"

run:
  timeout: 5m

# Both default to 3, which silently truncates a report: a clean-looking run of
# "4 issues" hid sixteen more while this file was being written. A lint result
# that is not the whole result is worse than no lint result.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
  settings:
    staticcheck:
      # The default set plus ST1000. A package comment that names a package
      # that no longer exists is how a rename half-lands: the code moves, the
      # sentence describing it does not, and nothing fails. This catches it,
      # and it caught two such comments left by the internal/retrieval split.
      checks:
        - all
        - ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    misspell:
      locale: US
      # "cancelled" is a finish_reason value the xAI API actually returns.
      # Correcting the spelling would change a wire-format string constant and
      # silently break finish-reason mapping, so it is exempt here rather than
      # suppressed line by line in provider/grok.
      #
      # "organise" appears in provider/pinecone as measured evidence that the
      # sparse model treats US and UK spellings as different terms. Correcting
      # it would delete the finding it documents.
      ignore-rules:
        - cancelled
        - organise
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
    paths:
      - vendor

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/regularkevvv/agentic
