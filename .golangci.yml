version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
  settings:
    misspell:
      locale: US
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
    paths:
      - vendor

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/regularkevvv/agentic
